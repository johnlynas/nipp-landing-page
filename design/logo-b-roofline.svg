<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <!-- Concept B: "Roofline P" — the letter P built from a house gable -->
  <g stroke="#16223a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- stem of the P / wall -->
    <line x1="18" y1="10" x2="18" y2="54"/>
    <!-- roof: diagonal from apex down-right, then bowl back to stem -->
    <path d="M18 10 L38 26 H50 a12 12 0 0 1 0 24 H30"/>
  </g>
  <!-- entry point at the apex -->
  <circle cx="18" cy="10" r="5.5" fill="#f5a623"/>
  <!-- wordmark -->
  <text x="72" y="41" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#16223a">Property NI</text>
</svg>
