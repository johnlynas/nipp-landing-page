<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <!-- Concept C: "NI Monogram" — two tenants, one roof; the diagonal is the connection -->
  <g stroke="#16223a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="54" x2="14" y2="10"/>
    <line x1="50" y1="54" x2="50" y2="10"/>
  </g>
  <!-- connecting diagonal (amber): the shared platform -->
  <line x1="14" y1="10" x2="50" y2="54" stroke="#f5a623" stroke-width="5.5" stroke-linecap="round"/>
  <!-- wordmark -->
  <text x="70" y="41" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#16223a">Property NI</text>
</svg>
